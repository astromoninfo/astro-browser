<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AstroBrowser</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; background: #202124; }
    #bar { display: flex; padding: 10px; background: #202124; gap: 8px; border-bottom: 1px solid #3c4043; }
    #url-input { flex: 1; padding: 10px; border-radius: 4px; border: none; font-size: 16px; background: #3c4043; color: white; outline: none; }
    button { padding: 8px 14px; background: #3c4043; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    button:hover { background: #5f6368; }
    iframe { flex: 1; border: none; width: 100%; height: 100%; background: white; }
  </style>
</head>
<body>

  <div id="bar">
    <button onclick="goBack()">◄</button>
    <button onclick="goForward()">►</button>
    <input type="text" id="url-input" placeholder="Escribe una URL (ej. astromon.es)..." onkeydown="if(event.key==='Enter') loadUrl()">
    <button onclick="loadUrl()">Ir</button>
  </div>

  <iframe id="viewport" src=""></iframe>

  <script>
    const iframe = document.getElementById('viewport');
    const input = document.getElementById('url-input');

    // Tu Worker de Cloudflare configurado
    const WORKER_PROXY = "https://browser.astromon-info.workers.dev";

    function loadUrl() {
      let url = input.value.trim();
      if (!url) return;
      if (!url.startsWith('http://') && !url.startsWith('https://')) {
        url = 'https://' + url;
      }
      
      // Enviamos la URL a través de tu proxy para evitar bloqueos
      iframe.src = `${WORKER_PROXY}?url=${encodeURIComponent(url)}`;
    }

    function goBack() { window.history.back(); }
    function goForward() { window.history.forward(); }

    // Registrar el Service Worker para habilitar la PWA
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
